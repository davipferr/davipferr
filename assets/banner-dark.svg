<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Davi Pinto Ferreira, full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <style>
      .orbit { transform-origin: 960px 150px; }
      .o1 { animation: spin 40s linear infinite; }
      .o2 { animation: spin 26s linear infinite reverse; }
      .o3 { animation: spin 60s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .o1, .o2, .o3 { animation: none; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Globe with orbits -->
    <circle cx="960" cy="150" r="190" fill="url(#glow)"/>
    <circle cx="960" cy="150" r="78" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <ellipse cx="960" cy="150" rx="78" ry="26" stroke="#38bdf8" stroke-opacity="0.25"/>
    <ellipse cx="960" cy="150" rx="78" ry="56" stroke="#38bdf8" stroke-opacity="0.18"/>
    <ellipse cx="960" cy="150" rx="28" ry="78" stroke="#38bdf8" stroke-opacity="0.25"/>
    <ellipse cx="960" cy="150" rx="58" ry="78" stroke="#38bdf8" stroke-opacity="0.18"/>

    <g class="orbit o1">
      <ellipse cx="960" cy="150" rx="150" ry="52" stroke="#a78bfa" stroke-opacity="0.45" transform="rotate(-18 960 150)"/>
      <circle cx="1102" cy="104" r="5" fill="#a78bfa"/>
    </g>
    <g class="orbit o2">
      <ellipse cx="960" cy="150" rx="118" ry="118" stroke="#38bdf8" stroke-opacity="0.18" stroke-dasharray="2 8"/>
      <circle cx="842" cy="150" r="3.5" fill="#38bdf8"/>
    </g>
    <g class="orbit o3">
      <ellipse cx="960" cy="150" rx="200" ry="70" stroke="#f472b6" stroke-opacity="0.25" transform="rotate(14 960 150)"/>
      <circle cx="1150" cy="190" r="4" fill="#f472b6"/>
    </g>

    <!-- Text -->
    <text x="72" y="118" fill="#94a3b8" font-size="18" letter-spacing="3">HI, I'M</text>
    <text x="70" y="172" fill="#f8fafc" font-size="54" font-weight="700">Davi Pinto Ferreira</text>
    <rect x="72" y="194" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="236" fill="#cbd5e1" font-size="22">Full-stack developer · 3D on the web · Data stories</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
